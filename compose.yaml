services:
  zenmap:
    image: ghcr.io/ploos-as/nmap-zenmap:latest
    container_name: zenmap
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: ${TZ:-Europe/Oslo}
      WEB_PORT: ${WEB_PORT:-6080}
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./config:/config
    restart: unless-stopped
