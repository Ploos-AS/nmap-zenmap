services:
  zenmap:
    build:
      context: .
      args:
        NMAP_VERSION: "7.991"
    image: ghcr.io/pgousdal/nmap-zenmap:latest
    container_name: zenmap
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Europe/Oslo
      WEB_PORT: "6080"
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config:/config
    restart: unless-stopped
